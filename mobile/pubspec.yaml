name: aspirin_lms
description: "Aspirin Medical LMS: High-Yield Lecture Streaming & Notes for Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # UI Design System & Typography
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.20
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Declarative Routing
  go_router: ^14.2.7

  # Reactive State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Hardware-Accelerated Video Playback (MPV / MediaCodec)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.8

  # High-Yield PDF Engine (PDFium)
  pdfrx: ^2.6.5

  # Native Android Background Downloader
  background_downloader: ^8.5.1

  # Type-Safe Offline SQLite Database
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24

  # Networking & HTTP Interceptors
  dio: ^5.6.0
  connectivity_plus: ^6.0.5

  # Authentication & Security
  clerk_flutter: ^0.0.18-beta
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1

  # Android Hardware & Screen Controls
  path_provider: ^2.1.4
  wakelock_plus: ^1.2.8
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
