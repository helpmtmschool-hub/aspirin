name: Migrate Notes to openmedQ SharePoint

# Migrates verified PDF notes directly from Telegram to openmedQ commercial SharePoint:
#   1. Marrow Edition 8 Main Notes (Final Year subjects, except medicine) -> Aspirin_LMS/Marrow_E8/Notes/
#   2. PrepLadder Version X Medicine Notes PDF -> Aspirin_LMS/PrepLadder_X/Medicine/
#
# Provenance & Verification:
# - Marrow E8: 14 clean master notes PDFs cross-verified from M-E 8 Notes (-1002863499861).
# - PrepLadder X: Master Edition (803.6 MB) and Mobile Edition (132.8 MB) verified.
# - Azure Graph Upload: 20 MiB chunked upload directly to openmedQ 25 TB SharePoint drive.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select Notes Target to Transfer"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "marrow_e8"
          - "prepx_medicine"
      dry_run:
        description: "Dry run (test without actually transferring)"
        required: true
        default: false
        type: boolean
      limit:
        description: "Limit number of files (0 = all)"
        required: true
        default: "0"
        type: string

concurrency:
  group: telegram-notes-migration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate_notes:
    name: Stream Notes to openmedQ SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Notes Migration
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "=========================================================="
          echo " Pipeline: Telegram -> openmedQ SharePoint"
          echo " Target:   $TARGET"
          echo " Limit:    $LIMIT"
          echo " Dry run:  ${{ github.event.inputs.dry_run }}"
          echo "=========================================================="

          python engine/migrate_notes_to_sharepoint.py \
            --target "$TARGET" \
            --limit "$LIMIT" \
            $DRY_RUN_FLAG
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          # App-level Client Credentials (MFA-exempt, guaranteed permanent access)
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_DRIVE_ID: ${{ secrets.M365_DRIVE_ID }}
          # Fallback delegated credentials
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Commit & Push Updated Manifest + Catalog
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git add engine/transfer_manifest.json public/transfer_manifest.json public/catalog.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync migrated marrow e8 and prepx medicine notes manifest [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-edit -s recursive -X ours origin main) || true
            git push origin main || true
          else
            echo "No changes to manifest or catalog to commit."
          fi
