name: Migrate Marrow Ophthalmology & ENT to openmedQ

# Migrates the 40 verified Marrow Edition 6 Ophthalmology lectures and
# 64 verified Marrow Edition 6 ENT lectures directly into openmedQ SharePoint:
#   - Aspirin_LMS/Marrow_E6/Ophthalmology/
#   - Aspirin_LMS/Marrow_E6/ENT/
#
# Provenance & Recovery:
# - Ophthalmology: 40 contiguous lectures cross-verified across My Marrow (-1003264222864, topic 211),
#   Subjectwise (-1003506593387, topic 2741), and Marrow Flat Channel (-1003659432109).
# - ENT: 64 complete lectures with recovered Lecture 52 ("Adenoid Hypertrophy", 814.7 MB, 3908s)
#   sourced from Subjectwise (-1003506593387, topic 3102, msg 3154) and corroborated with
#   Flat Channel msg 280.
#
# Execution:
# Scheduled every 3 hours at minute 17 (35 files/run -> completes all 104 lectures in 3 runs).

on:
  schedule:
    # Runs every 3 hours at minute 17 (off-peak minute avoids GitHub top-of-the-hour queue delays)
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      subject:
        description: "Select Subject to transfer ('ophthalmology,ent', 'ophthalmology', or 'ent')"
        required: true
        default: "ophthalmology,ent"
        type: choice
        options:
          - "ophthalmology,ent"
          - "ophthalmology"
          - "ent"
      batch_size:
        description: "Batch limit (number of files to transfer in this run)"
        required: true
        default: "35"
        type: string
      dry_run:
        description: "Dry run (test without actually transferring)"
        required: true
        default: false
        type: boolean

concurrency:
  group: telegram-transfer-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transfer:
    name: Stream Ophthalmology & ENT to openmedQ SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job execution time: 6 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Marrow Ophthalmology & ENT Transfer
        run: |
          SUBJECT="${{ github.event.inputs.subject || 'ophthalmology,ent' }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size || '35' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "=========================================================="
          echo " Pipeline: Telegram -> openmedQ SharePoint"
          echo " Platform: Marrow Edition 6"
          echo " Subject:  $SUBJECT"
          echo " Batch limit: $BATCH_SIZE"
          echo " Destination: Aspirin_LMS/Marrow_E6/{Ophthalmology|ENT}/"
          echo "=========================================================="

          python engine/telegram_to_onedrive.py \
            --platform marrow \
            --subject "$SUBJECT" \
            --limit "$BATCH_SIZE" \
            --videos-only \
            $DRY_RUN_FLAG
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          # Upload destination: openmedQ commercial tenant
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          # Read-only check for legacy tenant
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Sync Catalog Metadata
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Syncing catalog with updated manifest..."
          node engine/sync_catalog.cjs
        env:
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}

      - name: Commit & Push Updated Manifest + Catalog
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          python engine/merge_manifests.py
          node engine/sync_catalog.cjs || true
          git add engine/transfer_manifest.json public/transfer_manifest.json public/catalog.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync marrow optha & ent manifest + catalog [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-edit -s recursive -X ours origin main) || true
            git push origin main || true
          fi
