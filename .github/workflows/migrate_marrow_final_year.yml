name: Migrate Marrow Final Year Subjects to openmedQ

# Migrates all remaining Marrow Edition 6 Final Year lectures into openmedQ SharePoint:
#   1. Radiology (20 remaining lectures -> Aspirin_LMS/Marrow_E6/Radiology/)
#   2. Anesthesia (22 remaining lectures -> Aspirin_LMS/Marrow_E6/Anesthesia/)
#   3. Ophthalmology (40 lectures -> Aspirin_LMS/Marrow_E6/Ophthalmology/)
#   4. ENT (64 lectures, including recovered Lecture 52 -> Aspirin_LMS/Marrow_E6/ENT/)
#
# Provenance & Verification:
# - Radiology & Anesthesia: 100% 1:1 cross-verified with Subjectwise (-1003506593387) and My Marrow (-1003264222864).
# - Ophthalmology: 40 contiguous canonical lectures verified across 3 channels.
# - ENT: 64 complete lectures with recovered Lecture 52 ("Adenoid Hypertrophy") sourced from Subjectwise (topic 3102 msg 3154).
#
# Execution:
# Scheduled every 3 hours at minute 17 UTC (35 files/run -> completes all 146 lectures in ~5 runs).

on:
  schedule:
    # Runs every 3 hours at minute 17 (off-peak minute avoids GitHub top-of-the-hour queue delays)
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      subject:
        description: "Select Subject(s) to transfer"
        required: true
        default: "final_year"
        type: choice
        options:
          - "final_year"
          - "radiology,anesthesia"
          - "ophthalmology,ent"
          - "radiology"
          - "anesthesia"
          - "ophthalmology"
          - "ent"
      batch_size:
        description: "Batch limit (number of files to transfer in this run)"
        required: true
        default: "35"
        type: string
      dry_run:
        description: "Dry run (test without actually transferring)"
        required: true
        default: false
        type: boolean

concurrency:
  group: telegram-transfer-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transfer:
    name: Stream Final Year Subjects to openmedQ SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job execution time: 6 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Marrow Final Year Transfer
        run: |
          SUBJECT="${{ github.event.inputs.subject || 'final_year' }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size || '35' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "=========================================================="
          echo " Pipeline: Telegram -> openmedQ SharePoint"
          echo " Platform: Marrow Edition 6"
          echo " Subject:  $SUBJECT"
          echo " Batch limit: $BATCH_SIZE"
          echo " Target:   Aspirin_LMS/Marrow_E6/{Subject}/"
          echo "=========================================================="

          python engine/telegram_to_onedrive.py \
            --platform marrow \
            --subject "$SUBJECT" \
            --limit "$BATCH_SIZE" \
            --videos-only \
            $DRY_RUN_FLAG
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          # Upload destination: openmedQ commercial tenant
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          # Read-only check for legacy tenant
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Sync Catalog Metadata
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Syncing catalog with updated manifest..."
          node engine/sync_catalog.cjs
        env:
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}

      - name: Commit & Push Updated Manifest + Catalog
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          python engine/merge_manifests.py
          node engine/sync_catalog.cjs || true
          git add engine/transfer_manifest.json public/transfer_manifest.json public/catalog.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync marrow final year manifest + catalog [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-edit -s recursive -X ours origin main) || true
            git push origin main || true
          fi
