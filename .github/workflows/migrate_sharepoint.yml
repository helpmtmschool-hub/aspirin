name: Cloud-to-Cloud SharePoint Migration (PrepLadder Medicine)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max files to migrate in this run (leave empty for all remaining)"
        required: false
        default: ""
        type: string
      cooldown:
        description: "Cooldown seconds between uploads (default: 1.0s in cloud)"
        required: false
        default: "1.0"
        type: string
      dry_run:
        description: "Dry run (test without modifying files)"
        required: false
        default: false
        type: boolean

concurrency:
  group: sharepoint-migration-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    name: Azure Direct Datacenter Migration
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Cloud-to-Cloud Migration
        run: |
          LIMIT_FLAG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ github.event.inputs.limit }}"
          fi

          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          COOLDOWN="${{ github.event.inputs.cooldown || '1.0' }}"

          echo "=========================================================="
          echo " Starting Cloud-to-Cloud Migration on Azure Datacenter Pipe"
          echo " Target: /Aspirin_LMS/PrepLadder_X/Medicine/"
          echo " Cooldown: ${COOLDOWN}s"
          echo "=========================================================="

          python engine/migrate_prepx_medicine.py \
            --cooldown "$COOLDOWN" \
            $LIMIT_FLAG \
            $DRY_RUN_FLAG
        env:
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Commit & Push Updated Manifest
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git add engine/transfer_manifest.json public/transfer_manifest.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync migrated medicine manifest to openmedq [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-edit -s recursive -X ours origin main) || true
            git push origin main || true
          else
            echo "No changes to commit in manifest."
          fi
