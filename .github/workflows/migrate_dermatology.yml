name: Cloud-to-Cloud SharePoint Migration (Marrow Dermatology)

# Moves the 28 Marrow Edition 6 dermatology lectures (7.62 GiB) from the legacy
# 5ncjwt SharePoint to openmedQ, into /Aspirin_LMS/Marrow_E6/Dermatology with the
# verified titles from engine/marrow_derm_true_titles.json.
# Nothing is deleted; re-running is safe (files already on the destination at the
# same byte size are adopted instead of re-uploaded).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max files to transfer in this run (empty = all remaining)"
        required: false
        default: ""
        type: string
      cooldown:
        description: "Cooldown seconds between files"
        required: false
        default: "1.0"
        type: string
      dry_run:
        description: "Dry run - resolve paths and sizes, upload nothing"
        required: false
        default: true
        type: boolean
      verify_only:
        description: "Verify-only - report destination coverage, upload nothing"
        required: false
        default: false
        type: boolean
      rename_source:
        description: "Also rename the legacy SharePoint files to the verified titles"
        required: false
        default: false
        type: boolean

concurrency:
  group: sharepoint-migration-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    name: Azure Cloud-to-Cloud Transfer
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Marrow Dermatology Migration
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.verify_only }}" = "true" ]; then
            ARGS="$ARGS --verify-only"
          fi
          if [ "${{ github.event.inputs.rename_source }}" = "true" ]; then
            ARGS="$ARGS --rename-source"
          fi

          echo "=========================================================="
          echo " Marrow Dermatology: 5ncjwt SharePoint -> openmedQ SharePoint"
          echo " Target: /Aspirin_LMS/Marrow_E6/Dermatology/"
          echo " Flags:${ARGS:- (full transfer)}"
          echo "=========================================================="

          set +e
          python engine/migrate_marrow_dermatology.py \
            --cooldown "${{ github.event.inputs.cooldown || '1.0' }}" \
            $ARGS
          RC=$?
          set -e
          # A verify-only pass reports gaps via its exit code; that must not fail the job.
          if [ "$RC" != "0" ] && [ "${{ github.event.inputs.verify_only }}" = "true" ]; then
            echo "Verify-only pass finished with gaps (rc=$RC)"
            exit 0
          fi
          exit $RC
        env:
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Verify Destination Coverage
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          python engine/migrate_marrow_dermatology.py --verify-only \
            || echo "::warning::openmedQ dermatology coverage is incomplete - re-run this workflow to resume"
        env:
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Reconcile Manifest and Sync Catalog
        if: ${{ success() && github.event.inputs.dry_run != 'true' && github.event.inputs.verify_only != 'true' }}
        run: |
          # Union-merge whatever the scheduled Telegram pipeline pushed while this run was in
          # flight (their keys preserved, our freshly migrated ids winning), then rebuild the
          # catalog from the merged manifest.
          git fetch origin main || true
          python engine/merge_manifests.py
          node engine/sync_catalog.cjs
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}

      - name: Commit & Push Updated Manifest + Catalog
        if: ${{ always() && github.event.inputs.dry_run != 'true' && github.event.inputs.verify_only != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add engine/transfer_manifest.json public/transfer_manifest.json \
                  public/catalog.json engine/marrow_sections.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync migrated marrow dermatology manifest + catalog [skip ci]"
          git pull --no-rebase --strategy-option=ours origin main || true
          python engine/merge_manifests.py
          git add engine/transfer_manifest.json public/transfer_manifest.json
          git diff --staged --quiet || git commit -m "chore: reconcile manifest after merge [skip ci]"
          git push origin main || true
