name: Migrate PrepLadder Edition X PSM to openmedQ SharePoint

# Migrates PrepLadder Edition X Community Medicine (PSM):
#   - 116 High-Definition Video Lectures (16.06 GB, 61.4 Hours)
#   - Complete PrepLadder Version X PSM Notes PDF (81.66 MB)
#   - PrepLadder Version X PSM Question Bank PDF (17.46 MB)
# Target SharePoint Destination: Aspirin_LMS/PrepLadder_X/PSM/
#
# Execution:
# MANUAL TRIGGER ONLY (workflow_dispatch). No scheduled/cron triggers.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of files to transfer in this batch (0 = all remaining items)"
        required: true
        default: "0"
        type: string
      dry_run:
        description: "Dry run (simulate without downloading or uploading)"
        required: true
        default: false
        type: boolean

concurrency:
  group: mbbs-migration-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  migrate_psm:
    name: Transfer PrepLadder X PSM to SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours maximum execution window

    steps:
      - name: Free Up Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "Removing heavy unused preinstalled toolchains..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Execute PrepLadder Edition X PSM Transfer
        run: |
          LIMIT_FLAG=""
          if [ "${{ github.event.inputs.limit }}" != "0" ] && [ -n "${{ github.event.inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ github.event.inputs.limit }}"
          fi

          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "=========================================================="
          echo " Pipeline: Telegram -> openmedQ SharePoint (PrepLadder X PSM)"
          echo " Scope:    116 Video Lectures + Notes PDF + QBank PDF"
          echo " Target:   Aspirin_LMS/PrepLadder_X/PSM/"
          echo " Mode:     Manual Trigger (workflow_dispatch)"
          echo " Limit:    ${{ github.event.inputs.limit || 'All remaining' }}"
          echo " Dry run:  ${{ github.event.inputs.dry_run || 'false' }}"
          echo "=========================================================="

          python engine/migrate_prepx_psm.py \
            $LIMIT_FLAG \
            $DRY_RUN_FLAG
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Sync Catalog Metadata
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Syncing catalog with updated manifest..."
          node engine/sync_catalog.cjs || true
        env:
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}

      - name: Commit & Push Updated Manifest + Catalog
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git add engine/transfer_manifest.json public/transfer_manifest.json public/catalog.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync prepladder x psm manifest + catalog [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-edit -s recursive -X ours origin main) || true
            git push origin main || true
          fi

      - name: Check Remaining Queue Status
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          REMAINING=$(python -c "
          import json
          targets = json.load(open('engine/prepladder_x_psm_manifest.json'))
          manifest = json.load(open('engine/transfer_manifest.json'))
          completed = sum(1 for t in targets if t['id'] in manifest and manifest[t['id']].get('status') == 'completed')
          print(len(targets) - completed)
          ")
          echo "Remaining PrepLadder X PSM items: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            echo "Queue has $REMAINING items remaining. Trigger the next run when ready via: gh workflow run migrate_prepx_psm.yml"
          else
            echo "=========================================================="
            echo " All 118 PrepLadder Edition X PSM items have been transferred!"
            echo "=========================================================="
          fi
