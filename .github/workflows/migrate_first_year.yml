name: Migrate First Year Subjects to openmedQ

# Migrates all First Professional Year MBBS lectures into openmedQ SharePoint:
#   1. Anatomy (139 verified lectures -> Aspirin_LMS/eGurukul_4.0/01_Anatomy_Dr_Ashwini_Kumar/{Section}/)
#      - Faculty: Dr. Ashwini Kumar (eGurukul 4.0 / DBMCI)
#      - Sourced from Folderwise (topic 15033), corroborated with Subjectwise (topic 5071).
#      - Includes 1 Master Notes PDF (Anatomy 4.0 Complete Notes).
#   2. Physiology (61 verified lectures -> Aspirin_LMS/PrepLadder_X/Physiology/)
#      - Faculty: Dr. Vivek Nalgirkar (PrepLadder Edition X English)
#      - Sourced from Primary PrepX Channel (-1003709841202, msgs 116..176).
#      - Complete 1..61 series including recovered Lecture 32 (Oxygen Transport).
#   3. Biochemistry (61 verified lectures -> Aspirin_LMS/Marrow_E6/Biochemistry/)
#      - Faculty: Dr. Rebecca James (Marrow Edition 6)
#      - Sourced from My Marrow (topic 1318), canonical titles corroborated from Subjectwise (topic 2351).
#
# Execution:
# Scheduled every 3 hours at minute 17 UTC (runs 150 files/batch -> completes all 261 lectures in 2 batches).
# Concurrency lock ensures only 1 runner executes at a time to prevent Telegram rate limits.

on:
  schedule:
    # Runs every 3 hours at minute 17 (off-peak minute avoids GitHub top-of-the-hour queue delays)
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      subject:
        description: "Select Subject(s) to transfer (or 'first_year' for all 3 subjects)"
        required: true
        default: "first_year"
        type: choice
        options:
          - "first_year"
          - "anatomy"
          - "physiology"
          - "biochemistry"
      batch_size:
        description: "Batch limit (number of files to transfer in this run, 0 = all remaining)"
        required: true
        default: "150"
        type: string
      dry_run:
        description: "Dry run (test queue and existence checks without actually transferring)"
        required: true
        default: false
        type: boolean

concurrency:
  group: telegram-transfer-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  transfer:
    name: Stream First Year Subjects to openmedQ SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job execution time: 6 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute First Year Transfer
        run: |
          SUBJECT="${{ github.event.inputs.subject || 'first_year' }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size || '150' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "=========================================================="
          echo " Pipeline: Telegram -> openmedQ SharePoint (First Year)"
          echo " Subject:     $SUBJECT"
          echo " Batch limit: $BATCH_SIZE"
          echo " Scope:       Anatomy (eGurukul) + Physio (PrepX) + Biochem (Marrow)"
          echo " Target:      Aspirin_LMS/{Platform}/{Subject}/"
          echo "=========================================================="

          python engine/telegram_to_onedrive.py \
            --subject "$SUBJECT" \
            --limit "$BATCH_SIZE" \
            --videos-only \
            $DRY_RUN_FLAG
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          # Upload destination: openmedQ commercial tenant
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          # Read-only check for legacy tenant
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Sync Catalog Metadata
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Syncing catalog with updated manifest..."
          node engine/sync_catalog.cjs
        env:
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}

      - name: Commit & Push Updated Manifest + Catalog
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          python engine/merge_manifests.py
          node engine/sync_catalog.cjs || true
          git add engine/transfer_manifest.json public/transfer_manifest.json public/catalog.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync first year transfer manifest + catalog [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-edit -s recursive -X ours origin main) || true
            git push origin main || true
          fi

      - name: Auto-Trigger Next Run if Pending Lectures Remain
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          REMAINING=$(python -c "
          from engine.telegram_to_onedrive import LectureTransferEngine
          e = LectureTransferEngine(None, None, True, True)
          q = e.load_queue(None, 'first_year')
          print(len(q))
          ")
          echo "Remaining lectures in queue: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            echo "Queue has $REMAINING first-year lectures remaining! Auto-triggering next batch..."
            gh workflow run migrate_first_year.yml || true
          else
            echo "=========================================================="
            echo " All First-Year MBBS lectures have been 100% transferred!"
            echo "=========================================================="
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

