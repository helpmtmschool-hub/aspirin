name: Transfer Lectures from Telegram to OneDrive

on:
  schedule:
    # Runs automatically every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: "Select Platform / Curriculum (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - prepx_en
          - prepx_hi
          - cerebellum
      subject:
        description: "Select Subject to transfer (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - medicine
          - surgery
          - obg
          - pediatrics
          - orthopedics
          - dermatology
          - psychiatry
          - radiology
          - anesthesia
          - psm
          - forensic_medicine
          - ophthalmology
          - ent
          - pathology
          - pharmacology
          - microbiology
          - anatomy
          - physiology
          - biochemistry
          - notes_pdf
      batch_size:
        description: "Batch limit (number of files to transfer in this run)"
        required: true
        default: "25"
        type: string
      dry_run:
        description: "Dry run (test without actually transferring)"
        required: true
        default: false
        type: boolean

concurrency:
  group: telegram-transfer-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transfer:
    name: Stream Lectures to OneDrive
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job execution time: 6 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Telegram to OneDrive Pipeline
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          SUBJECT="${{ github.event.inputs.subject || 'all' }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size || '25' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "Starting Telegram to SharePoint transfer batch..."
          echo "Platform: $PLATFORM"
          echo "Subject: $SUBJECT"
          echo "Batch size: $BATCH_SIZE"
          echo "Dry run flag: $DRY_RUN_FLAG"

          python engine/telegram_to_onedrive.py \
            --platform "$PLATFORM" \
            --subject "$SUBJECT" \
            --limit "$BATCH_SIZE" \
            $DRY_RUN_FLAG
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          ONEDRIVE_TENANT_ID: ${{ secrets.ONEDRIVE_TENANT_ID || '938a1924-0af0-4599-819b-177a1dcf8fd6' }}
          ONEDRIVE_DRIVE_TARGET: "sites/root/drive"
          PYTHONUNBUFFERED: "1"

      - name: Commit & Push Updated Manifest
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add engine/transfer_manifest.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync transfer manifest [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
