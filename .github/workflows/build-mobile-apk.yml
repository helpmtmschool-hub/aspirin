name: Build Mobile Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'

jobs:
  build-android:
    name: Build Android APK on GitHub Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK Tools
        uses: android-actions/setup-android@v4

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: 🔨 Generate Native Android Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform android --clean --no-install
        env:
          CI: 'true'

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x mobile/android/gradlew

      - name: 🚀 Compile Android APK with Gradle
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspirin-mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 📋 Summary Notice
        run: |
          echo "### 🎉 Android APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "The APK has been compiled and is available under the **Artifacts** section as \`aspirin-mobile-debug-apk\`." >> $GITHUB_STEP_SUMMARY
          echo "You can download it directly to your Android device to install and test." >> $GITHUB_STEP_SUMMARY
