name: Migrate Third Year Subjects to openmedQ

# Migrates all Third Professional Year (Part 1) MBBS lectures into openmedQ SharePoint:
#   1. Forensic Medicine & Toxicology (38 verified lectures -> Aspirin_LMS/Marrow_E6/Forensic_Medicine/)
#      - Faculty: Dr. Akhilesh Raj / Dr. Magendran (Marrow Edition 6)
#      - Sourced from My Marrow Channel (-1003264222864, Topic 107, msgs 108..145) & Subjectwise Topic 2147.
#      - Contiguous 1..38 sequence with zero missing lectures (100% complete).
#   2. Preventive & Social Medicine (157 video lectures + 1 Master Notes PDF -> Aspirin_LMS/Cerebellum/04_PSM_Dr_Vivek_Jain/{Section}/)
#      - Faculty: Dr. Vivek Jain (Cerebellum Academy)
#      - Sourced from Primary Channel (-1003709841202, msgs 3209..3365) & Folderwise Topic 46021.
#      - 28 canonical modules, includes 15 Clinical Punches and Dr. Vivek Jain Complete Course Notes PDF.
#
# Execution:
# Scheduled every 3 hours at minute 17 UTC (runs 150 files/batch -> completes all 195 video lectures in 2 batches).
# Concurrency lock ensures only 1 runner executes at a time to prevent Telegram rate limits.

on:
  schedule:
    # Runs every 3 hours at minute 17 (off-peak minute avoids GitHub top-of-the-hour queue delays)
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      subject:
        description: "Select Subject(s) to transfer (or 'third_year' for both subjects)"
        required: true
        default: "third_year"
        type: choice
        options:
          - "third_year"
          - "fmt"
          - "psm"
      batch_size:
        description: "Batch limit (number of files to transfer in this run, 0 = all remaining)"
        required: true
        default: "150"
        type: string
      dry_run:
        description: "Dry run (test queue and existence checks without actually transferring)"
        required: true
        default: false
        type: boolean

concurrency:
  group: telegram-transfer-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  transfer:
    name: Stream Third Year Subjects to openmedQ SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum job execution time: 6 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Third Year Transfer
        run: |
          SUBJECT="${{ github.event.inputs.subject || 'third_year' }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size || '150' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "=========================================================="
          echo " Pipeline: Telegram -> openmedQ SharePoint (Third Year)"
          echo " Subject:     $SUBJECT"
          echo " Batch limit: $BATCH_SIZE"
          echo " Scope:       FMT (Marrow E6) + PSM (Cerebellum Dr. Vivek Jain)"
          echo " Target:      Aspirin_LMS/{Platform}/{Subject}/"
          echo "=========================================================="

          python engine/telegram_to_onedrive.py \
            --subject "$SUBJECT" \
            --limit "$BATCH_SIZE" \
            --videos-only \
            $DRY_RUN_FLAG
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          # Upload destination: openmedQ commercial tenant
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          # Read-only check for legacy tenant
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Sync Catalog Metadata
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Syncing catalog with updated manifest..."
          node engine/sync_catalog.cjs
        env:
          NEW_ONEDRIVE_CLIENT_ID: ${{ secrets.NEW_ONEDRIVE_CLIENT_ID }}
          NEW_ONEDRIVE_TENANT_ID: ${{ secrets.NEW_ONEDRIVE_TENANT_ID }}
          NEW_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.NEW_ONEDRIVE_REFRESH_TOKEN }}
          OLD_ONEDRIVE_CLIENT_ID: ${{ secrets.OLD_ONEDRIVE_CLIENT_ID }}
          OLD_ONEDRIVE_TENANT_ID: ${{ secrets.OLD_ONEDRIVE_TENANT_ID }}
          OLD_ONEDRIVE_REFRESH_TOKEN: ${{ secrets.OLD_ONEDRIVE_REFRESH_TOKEN }}

      - name: Commit & Push Updated Manifest + Catalog
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          python engine/merge_manifests.py
          node engine/sync_catalog.cjs || true
          git add engine/transfer_manifest.json public/transfer_manifest.json public/catalog.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync third year transfer manifest + catalog [skip ci]"
            git pull --rebase -X theirs origin main || (git rebase --abort && git pull --no-edit -s recursive -X ours origin main) || true
            git push origin main || true
          fi

      - name: Auto-Trigger Next Run if Pending Lectures Remain
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          REMAINING=$(python -c "
          from engine.telegram_to_onedrive import LectureTransferEngine
          e = LectureTransferEngine(None, None, True, True)
          q = e.load_queue(None, 'third_year')
          print(len(q))
          ")
          echo "Remaining lectures in queue: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            echo "Queue has $REMAINING third-year lectures remaining! Auto-triggering next batch..."
            gh workflow run migrate_third_year.yml || true
          else
            echo "=========================================================="
            echo " All Third-Year MBBS lectures have been 100% transferred!"
            echo "=========================================================="
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

